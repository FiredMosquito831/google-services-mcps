name: Site check

# Runs the same command locally and in CI: python scripts/build_site.py --check.
# The site lives on the revamp branch and is never merged; the gate runs on pushes to it
# and on pull requests that touch the site paths.
on:
  pull_request:
    paths:
      - "docs/**"
      - "site-revamp/**"
      - "scripts/build_site.py"
      - "requirements-site.txt"
      - ".github/workflows/site.yml"
  push:
    branches: [revamp]
    paths:
      - "docs/**"
      - "site-revamp/**"
      - "scripts/build_site.py"
      - "requirements-site.txt"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --requirement requirements-site.txt
      - run: python scripts/build_site.py --check
