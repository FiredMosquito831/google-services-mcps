<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="ph-title ph-desc" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
  <title id="ph-title">The plugin-to-harness map</title>
  <desc id="ph-desc">Twenty-three product plugin folders, grouped by login group, each starting one MCP server. Claude Code starts the server through the plugin and its PreToolUse hook; Codex, OpenCode and Antigravity start the same server from a runtime copy with no hook.</desc>

  <!-- Column labels -->
  <text x="16" y="26" fill="var(--text-muted)" font-size="12" letter-spacing="1.2">PRODUCT PLUGINS (23)</text>
  <text x="360" y="26" fill="var(--text-muted)" font-size="12" letter-spacing="1.2">MCP SERVER</text>
  <text x="640" y="26" fill="var(--text-muted)" font-size="12" letter-spacing="1.2">HARNESS</text>

  <!-- Group cloud -->
  <g>
    <rect x="16" y="44" width="300" height="52" rx="8" fill="var(--surface)" stroke="var(--border)"/>
    <circle cx="34" cy="70" r="5" fill="var(--accent)"/>
    <text x="48" y="66" fill="var(--text)" font-size="13" font-weight="700">cloud</text>
    <text x="48" y="84" fill="var(--text-muted)" font-size="11">gcloud · gai</text>
  </g>
  <!-- Group searchconsole -->
  <g>
    <rect x="16" y="104" width="300" height="52" rx="8" fill="var(--surface)" stroke="var(--border)"/>
    <circle cx="34" cy="130" r="5" fill="var(--accent)"/>
    <text x="48" y="126" fill="var(--text)" font-size="13" font-weight="700">searchconsole</text>
    <text x="48" y="144" fill="var(--text-muted)" font-size="11">gsc</text>
  </g>
  <!-- Group workspace-user -->
  <g>
    <rect x="16" y="164" width="300" height="70" rx="8" fill="var(--surface)" stroke="var(--border)"/>
    <circle cx="34" cy="190" r="5" fill="var(--accent)"/>
    <text x="48" y="186" fill="var(--text)" font-size="13" font-weight="700">workspace-user</text>
    <text x="48" y="204" fill="var(--text-muted)" font-size="11">gdrive · gmail · gcalendar · gchat · gmeet</text>
    <text x="48" y="220" fill="var(--text-muted)" font-size="11">gcontacts · gtasks · gclassroom · gapps</text>
  </g>
  <!-- Group workspace-admin -->
  <g>
    <rect x="16" y="242" width="300" height="52" rx="8" fill="var(--surface)" stroke="var(--border)"/>
    <circle cx="34" cy="268" r="5" fill="var(--warning)"/>
    <text x="48" y="264" fill="var(--text)" font-size="13" font-weight="700">workspace-admin</text>
    <text x="48" y="282" fill="var(--text-muted)" font-size="11">gadmin</text>
  </g>
  <!-- Group business -->
  <g>
    <rect x="16" y="302" width="300" height="70" rx="8" fill="var(--surface)" stroke="var(--border)"/>
    <circle cx="34" cy="328" r="5" fill="var(--accent)"/>
    <text x="48" y="324" fill="var(--text)" font-size="13" font-weight="700">business</text>
    <text x="48" y="342" fill="var(--text-muted)" font-size="11">ganalytics · gtm · gyoutube · gbusiness</text>
    <text x="48" y="358" fill="var(--text-muted)" font-size="11">gads</text>
  </g>
  <!-- Group developer + service-account + apikey -->
  <g>
    <rect x="16" y="380" width="300" height="52" rx="8" fill="var(--surface)" stroke="var(--border)"/>
    <circle cx="34" cy="406" r="5" fill="var(--accent)"/>
    <text x="48" y="402" fill="var(--text)" font-size="13" font-weight="700">developer</text>
    <text x="48" y="420" fill="var(--text-muted)" font-size="11">gfirebase</text>
  </g>
  <g>
    <rect x="16" y="440" width="146" height="52" rx="8" fill="var(--surface)" stroke="var(--border)"/>
    <circle cx="34" cy="466" r="5" fill="var(--success)"/>
    <text x="48" y="462" fill="var(--text)" font-size="12" font-weight="700">service-account</text>
    <text x="48" y="480" fill="var(--text-muted)" font-size="11">gplay · gmerchant</text>
  </g>
  <g>
    <rect x="170" y="440" width="146" height="52" rx="8" fill="var(--surface)" stroke="var(--border)"/>
    <circle cx="188" cy="466" r="5" fill="var(--success)"/>
    <text x="202" y="462" fill="var(--text)" font-size="12" font-weight="700">apikey</text>
    <text x="202" y="480" fill="var(--text-muted)" font-size="11">gsearch · gmaps</text>
  </g>

  <!-- Arrows to server column -->
  <g stroke="var(--border)" stroke-width="1.5" fill="none">
    <path d="M316 70 H344"/>
    <path d="M316 130 H344"/>
    <path d="M316 199 H344"/>
    <path d="M316 268 H344"/>
    <path d="M316 337 H344"/>
    <path d="M316 406 H344"/>
    <path d="M316 466 H344"/>
  </g>

  <!-- Server column -->
  <g>
    <rect x="344" y="44" width="240" height="448" rx="10" fill="var(--surface-2)" stroke="var(--accent)"/>
    <text x="464" y="80" fill="var(--text)" font-size="14" font-weight="700" text-anchor="middle">one server per product</text>
    <text x="464" y="102" fill="var(--text-muted)" font-size="11" text-anchor="middle">servers/&lt;id&gt;.mjs</text>
    <text x="464" y="124" fill="var(--text-muted)" font-size="11" text-anchor="middle">stdio, local Node.js process</text>
    <line x1="368" y1="144" x2="560" y2="144" stroke="var(--border)"/>
    <text x="464" y="172" fill="var(--text)" font-size="12" text-anchor="middle">tool-map.json</text>
    <text x="464" y="192" fill="var(--text-muted)" font-size="11" text-anchor="middle">every tool, its class, its scopes</text>
    <text x="464" y="222" fill="var(--text)" font-size="12" text-anchor="middle">scopes.json</text>
    <text x="464" y="242" fill="var(--text-muted)" font-size="11" text-anchor="middle">the OAuth scopes of each API</text>
    <text x="464" y="272" fill="var(--text)" font-size="12" text-anchor="middle">servers.json</text>
    <text x="464" y="292" fill="var(--text-muted)" font-size="11" text-anchor="middle">APIs, gateway APIs, login group</text>
    <line x1="368" y1="312" x2="560" y2="312" stroke="var(--border)"/>
    <text x="464" y="340" fill="var(--text)" font-size="12" text-anchor="middle">token directory</text>
    <text x="464" y="360" fill="var(--text-muted)" font-size="11" text-anchor="middle">~/.google-services-mcps</text>
    <text x="464" y="390" fill="var(--text)" font-size="12" text-anchor="middle">Google APIs</text>
    <text x="464" y="410" fill="var(--text-muted)" font-size="11" text-anchor="middle">HTTPS, with your credentials</text>
    <text x="464" y="452" fill="var(--text-muted)" font-size="11" text-anchor="middle">no server of the suite's own</text>
    <text x="464" y="470" fill="var(--text-muted)" font-size="11" text-anchor="middle">no telemetry path</text>
  </g>

  <!-- Arrows to harness column -->
  <g stroke="var(--border)" stroke-width="1.5" fill="none">
    <path d="M584 130 H612"/>
    <path d="M584 250 H612"/>
    <path d="M584 370 H612"/>
  </g>

  <!-- Harness column -->
  <g>
    <rect x="612" y="44" width="332" height="112" rx="10" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>
    <text x="632" y="72" fill="var(--text)" font-size="14" font-weight="700">Claude Code</text>
    <text x="632" y="94" fill="var(--text-muted)" font-size="11">marketplace → plugin → server</text>
    <text x="632" y="114" fill="var(--text-muted)" font-size="11">PreToolUse hook asks before a change</text>
    <text x="632" y="134" fill="var(--text-muted)" font-size="11">destructive actions ask twice</text>
  </g>
  <g>
    <rect x="612" y="170" width="332" height="72" rx="10" fill="var(--surface)" stroke="var(--border)"/>
    <text x="632" y="198" fill="var(--text)" font-size="14" font-weight="700">Codex</text>
    <text x="632" y="220" fill="var(--text-muted)" font-size="11">config.toml → runtime copy</text>
    <text x="632" y="236" fill="var(--text-muted)" font-size="11">no hook; changes need MCP elicitation</text>
  </g>
  <g>
    <rect x="612" y="256" width="332" height="72" rx="10" fill="var(--surface)" stroke="var(--border)"/>
    <text x="632" y="284" fill="var(--text)" font-size="14" font-weight="700">OpenCode</text>
    <text x="632" y="306" fill="var(--text-muted)" font-size="11">opencode.json → runtime copy</text>
    <text x="632" y="322" fill="var(--text-muted)" font-size="11">no hook; changes need MCP elicitation</text>
  </g>
  <g>
    <rect x="612" y="342" width="332" height="72" rx="10" fill="var(--surface)" stroke="var(--border)"/>
    <text x="632" y="370" fill="var(--text)" font-size="14" font-weight="700">Antigravity</text>
    <text x="632" y="392" fill="var(--text-muted)" font-size="11">mcp_config.json → runtime copy</text>
    <text x="632" y="408" fill="var(--text-muted)" font-size="11">global scope only; no hook</text>
  </g>

  <!-- Legend -->
  <g transform="translate(612, 432)">
    <text x="0" y="12" fill="var(--text-muted)" font-size="11" letter-spacing="1">LEGEND</text>
    <circle cx="6" cy="32" r="5" fill="var(--accent)"/>
    <text x="20" y="36" fill="var(--text-muted)" font-size="11">OAuth user login</text>
    <circle cx="6" cy="52" r="5" fill="var(--warning)"/>
    <text x="20" y="56" fill="var(--text-muted)" font-size="11">service account, domain-wide</text>
    <circle cx="6" cy="72" r="5" fill="var(--success)"/>
    <text x="20" y="76" fill="var(--text-muted)" font-size="11">service account key or API key</text>
  </g>
</svg>
