<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="am-title am-desc" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
  <title id="am-title">The auth model</title>
  <desc id="am-desc">Three credential kinds — a Desktop OAuth client per login group, a service account key, and an API key — feed the token directory. The MCP server reads the tokens and calls Google over HTTPS. Every change passes the gate: token scopes, tool registration, the approval hook, the confirmation setting, the policy file and the audit log.</desc>

  <text x="16" y="26" fill="var(--text-muted)" font-size="12" letter-spacing="1.2">AUTH MODEL</text>

  <!-- Credential kinds -->
  <g>
    <rect x="16" y="44" width="250" height="96" rx="10" fill="var(--surface)" stroke="var(--accent)"/>
    <text x="34" y="70" fill="var(--text)" font-size="13" font-weight="700">Desktop OAuth client</text>
    <text x="34" y="92" fill="var(--text-muted)" font-size="11">one per Google Cloud project</text>
    <text x="34" y="110" fill="var(--text-muted)" font-size="11">one login per group: cloud,</text>
    <text x="34" y="126" fill="var(--text-muted)" font-size="11">searchconsole, workspace-user, business, developer</text>
  </g>
  <g>
    <rect x="16" y="156" width="250" height="82" rx="10" fill="var(--surface)" stroke="var(--warning)"/>
    <text x="34" y="182" fill="var(--text)" font-size="13" font-weight="700">Service account key</text>
    <text x="34" y="204" fill="var(--text-muted)" font-size="11">domain-wide delegation: workspace-admin</text>
    <text x="34" y="222" fill="var(--text-muted)" font-size="11">a key file: service-account (gplay, gmerchant)</text>
  </g>
  <g>
    <rect x="16" y="254" width="250" height="66" rx="10" fill="var(--surface)" stroke="var(--success)"/>
    <text x="34" y="280" fill="var(--text)" font-size="13" font-weight="700">API key</text>
    <text x="34" y="302" fill="var(--text-muted)" font-size="11">apikey group: gsearch, gmaps</text>
  </g>

  <!-- Arrows to token dir -->
  <g stroke="var(--border)" stroke-width="1.5" fill="none">
    <path d="M266 92 H310"/>
    <path d="M266 197 H310"/>
    <path d="M266 287 H310"/>
  </g>

  <!-- Token directory -->
  <g>
    <rect x="310" y="44" width="250" height="276" rx="10" fill="var(--surface-2)" stroke="var(--accent)"/>
    <text x="435" y="72" fill="var(--text)" font-size="14" font-weight="700" text-anchor="middle">token directory</text>
    <text x="435" y="94" fill="var(--text-muted)" font-size="11" text-anchor="middle">~/.google-services-mcps</text>
    <line x1="330" y1="110" x2="540" y2="110" stroke="var(--border)"/>
    <text x="330" y="134" fill="var(--text-muted)" font-size="11">client_secret.json</text>
    <text x="330" y="156" fill="var(--text-muted)" font-size="11">&lt;group&gt;.token.json</text>
    <text x="330" y="178" fill="var(--text-muted)" font-size="11">apikey.json</text>
    <text x="330" y="200" fill="var(--text-muted)" font-size="11">workspace-admin.scopes.json</text>
    <text x="330" y="222" fill="var(--text-muted)" font-size="11">service-account.json</text>
    <text x="330" y="244" fill="var(--text-muted)" font-size="11">policy.json</text>
    <text x="330" y="266" fill="var(--text-muted)" font-size="11">audit.log</text>
    <text x="330" y="294" fill="var(--text-muted)" font-size="11">mode 0600 where supported;</text>
    <text x="330" y="310" fill="var(--text-muted)" font-size="11">on Windows, a limited access list</text>
  </g>

  <!-- Arrow to server -->
  <path d="M560 182 H604" stroke="var(--border)" stroke-width="1.5" fill="none" marker-end="url(#am-arrow)"/>

  <!-- Server -->
  <g>
    <rect x="604" y="44" width="180" height="276" rx="10" fill="var(--surface)" stroke="var(--border)"/>
    <text x="694" y="72" fill="var(--text)" font-size="14" font-weight="700" text-anchor="middle">MCP server</text>
    <text x="694" y="94" fill="var(--text-muted)" font-size="11" text-anchor="middle">local Node.js process</text>
    <line x1="624" y1="110" x2="764" y2="110" stroke="var(--border)"/>
    <text x="624" y="134" fill="var(--text-muted)" font-size="11">reads the token for</text>
    <text x="624" y="150" fill="var(--text-muted)" font-size="11">its group</text>
    <text x="624" y="176" fill="var(--text-muted)" font-size="11">registers only the tools</text>
    <text x="624" y="192" fill="var(--text-muted)" font-size="11">the token covers</text>
    <text x="624" y="218" fill="var(--text-muted)" font-size="11">calls Google over HTTPS</text>
    <text x="624" y="244" fill="var(--text-muted)" font-size="11">retries 429, 503 and</text>
    <text x="624" y="260" fill="var(--text-muted)" font-size="11">read 403s, 3 attempts</text>
    <text x="624" y="292" fill="var(--text-muted)" font-size="11">redacts credential fields</text>
    <text x="624" y="308" fill="var(--text-muted)" font-size="11">in read results</text>
  </g>

  <!-- Arrow to Google -->
  <path d="M784 182 H828" stroke="var(--border)" stroke-width="1.5" fill="none" marker-end="url(#am-arrow)"/>

  <!-- Google -->
  <g>
    <rect x="828" y="44" width="116" height="276" rx="10" fill="var(--surface)" stroke="var(--border)"/>
    <text x="886" y="72" fill="var(--text)" font-size="13" font-weight="700" text-anchor="middle">Google</text>
    <line x1="844" y1="88" x2="928" y2="88" stroke="var(--border)"/>
    <text x="844" y="112" fill="var(--text-muted)" font-size="11">APIs</text>
    <text x="844" y="134" fill="var(--text-muted)" font-size="11">OAuth</text>
    <text x="844" y="156" fill="var(--text-muted)" font-size="11">tokeninfo</text>
    <text x="844" y="186" fill="var(--text-muted)" font-size="11">scope checks</text>
    <text x="844" y="208" fill="var(--text-muted)" font-size="11">quotas</text>
    <text x="844" y="230" fill="var(--text-muted)" font-size="11">billing</text>
    <text x="844" y="252" fill="var(--text-muted)" font-size="11">approval rules</text>
  </g>

  <!-- Gate strip -->
  <g>
    <rect x="16" y="348" width="928" height="106" rx="10" fill="var(--surface-2)" stroke="var(--warning)" stroke-width="2"/>
    <text x="34" y="374" fill="var(--text)" font-size="13" font-weight="700">The gate: every change, in order</text>
    <g font-size="11" fill="var(--text-muted)">
      <text x="34" y="400">1. token scopes — Google rejects a call outside them</text>
      <text x="34" y="420">2. tool registration — write and destructive tools are hidden while Allow write tools is off</text>
      <text x="34" y="440">3. approval — the PreToolUse hook asks and never allows; a destructive call also shows an exact form</text>
      <text x="502" y="400">4. confirmation — every-change, destructive-only or off</text>
      <text x="502" y="420">5. policy.json — deny wins, then ask, then allow</text>
      <text x="502" y="440">6. audit.log — one line, a hash of the arguments, never the values</text>
    </g>
  </g>

  <defs>
    <marker id="am-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--border)"/>
    </marker>
  </defs>
</svg>
